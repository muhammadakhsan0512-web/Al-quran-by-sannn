<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web Hub • BY SANNN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;

  background:
    radial-gradient(
      circle at top,
      #173b68,
      transparent 45%
    ),
    linear-gradient(
      135deg,
      #050914,
      #0b1220
    );

  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:600px;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:25px;
  animation:fadeDown .7s ease;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;

  border-radius:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:32px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  box-shadow:
    0 15px 40px #2563eb55;

  animation:
    float 3s ease-in-out infinite;
}

h1{
  margin:15px 0 5px;
  font-size:28px;
}

.subtitle{
  color:#94a3b8;
  font-size:13px;
}


/* MENU */

.menu{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.menu-button{
  width:100%;

  border:1px solid rgba(255,255,255,.1);

  background:
    rgba(255,255,255,.07);

  color:white;

  border-radius:18px;

  padding:17px;

  display:flex;
  align-items:center;

  gap:15px;

  text-align:left;

  cursor:pointer;

  backdrop-filter:blur(12px);

  transition:.25s;

  animation:
    fadeUp .6s ease both;
}

.menu-button:nth-child(2){
  animation-delay:.1s;
}

.menu-button:nth-child(3){
  animation-delay:.2s;
}

.menu-button:hover{
  transform:
    translateY(-4px)
    scale(1.01);

  background:
    rgba(59,130,246,.18);

  border-color:#3b82f6;

  box-shadow:
    0 12px 30px #0005;
}

.menu-button:active{
  transform:scale(.97);
}

.icon{
  width:50px;
  height:50px;

  flex-shrink:0;

  border-radius:15px;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:24px;

  background:
    linear-gradient(
      135deg,
      #1d4ed8,
      #7c3aed
    );
}

.menu-text{
  flex:1;
}

.menu-text strong{
  display:block;
  font-size:16px;
  margin-bottom:5px;
}

.menu-text small{
  color:#94a3b8;
  font-size:11px;
  line-height:1.4;
}

.arrow{
  color:#64748b;
  font-size:22px;
}


/* REWARD */

.reward{
  display:inline-block;

  margin-top:7px;

  padding:4px 8px;

  border-radius:8px;

  background:#dc2626;

  color:white;

  font-size:10px;

  font-weight:bold;

  letter-spacing:.5px;
}


/* AI SUARA */

.voice-box{
  margin-top:15px;

  padding:18px;

  border-radius:20px;

  border:1px solid rgba(255,255,255,.1);

  background:
    rgba(255,255,255,.07);

  backdrop-filter:blur(12px);

  animation:fadeUp .7s ease;
}

.voice-title{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:13px;
}

.voice-title h2{
  font-size:17px;
  margin:0;
}

.voice-status{
  color:#94a3b8;
  font-size:11px;
  margin-bottom:12px;
}

.voice-output{
  min-height:55px;

  padding:12px;

  border-radius:12px;

  background:
    rgba(0,0,0,.18);

  color:#dbeafe;

  font-size:13px;

  line-height:1.5;

  margin-bottom:12px;
}

.voice-buttons{
  display:flex;
  gap:8px;
}

.voice-btn{
  flex:1;

  border:0;

  padding:12px;

  border-radius:12px;

  color:white;

  background:#2563eb;

  font-weight:bold;

  cursor:pointer;
}

.voice-btn.stop{
  background:#dc2626;
}

.voice-btn.speak{
  background:#7c3aed;
}

.voice-btn:active{
  transform:scale(.97);
}

.listening{
  box-shadow:
    0 0 0 4px
    rgba(59,130,246,.15);

  animation:pulse 1.2s infinite;
}


/* FOOTER */

.footer{
  text-align:center;

  color:#64748b;

  font-size:10px;

  margin-top:25px;

  letter-spacing:2px;
}


/* ANIMASI */

@keyframes fadeDown{
  from{
    opacity:0;
    transform:translateY(-20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }
}

@keyframes pulse{
  0%,100%{
    box-shadow:
      0 0 0 0
      rgba(59,130,246,.35);
  }

  50%{
    box-shadow:
      0 0 0 8px
      rgba(59,130,246,0);
  }
}


/* MOBILE */

@media(max-width:420px){

  body{
    padding:12px;
  }

  .voice-buttons{
    flex-direction:column;
  }

}
</style>
</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      🌐
    </div>

    <h1>
      Web Hub
    </h1>

    <div class="subtitle">
      Pilih website yang ingin kamu buka
    </div>

  </div>


  <!-- MENU -->

  <div class="menu">


    <!-- WEB 1 -->

    <button
      class="menu-button"
      onclick="openQuran()">

      <div class="icon">
        📖
      </div>

      <div class="menu-text">

        <strong>
          1. Web Al-Qur'an
        </strong>

        <small>
          Baca Al-Qur'an dan gunakan fitur Islami
        </small>

        <div class="reward">
          🔒 REWARD DI TUTUP
        </div>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- WEB 2 -->

    <button
      class="menu-button"
      onclick="openTabungan()">

      <div class="icon">
        💰
      </div>

      <div class="menu-text">

        <strong>
          2. Web Tabungan
        </strong>

        <small>
          Dashboard tabungan dan keuangan
        </small>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- WEB 3 -->

    <button
      class="menu-button"
      onclick="comingSoon()">

      <div class="icon">
        ✨
      </div>

      <div class="menu-text">

        <strong>
          3. Web Segera Hadir
        </strong>

        <small>
          Nantikan website berikutnya
        </small>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>

  </div>


  <!-- MODE SUARA -->

  <div class="voice-box">

    <div class="voice-title">

      <span style="font-size:23px;">
        🎙️
      </span>

      <h2>
        Mode AI Suara
      </h2>

    </div>


    <div
      class="voice-status"
      id="voiceStatus">

      Tekan "Mulai Bicara", lalu bicara dengan jelas.

    </div>


    <div
      class="voice-output"
      id="voiceOutput">

      Hasil suara akan muncul di sini...

    </div>


    <div class="voice-buttons">

      <button
        class="voice-btn"
        id="startVoice"
        onclick="startVoice()">

        🎤 Mulai Bicara

      </button>


      <button
        class="voice-btn stop"
        onclick="stopVoice()">

        ⏹ Berhenti

      </button>


      <button
        class="voice-btn speak"
        onclick="speakText()">

        🔊 Bacakan

      </button>

    </div>

  </div>


  <div class="footer">
    BY SANNN
  </div>

</div>


<script>

/* =========================
   LINK WEBSITE
========================= */

function openQuran(){

  window.location.href =
    "https://muhammadakhsan0512-web.github.io/Al-quran-by-sannn/";

}


function openTabungan(){

  window.location.href =
    "https://muhammadakhsan0512-web.github.io/Tabungan.akhsan/";

}


function comingSoon(){

  alert(
    "Web nomor 3 belum tersedia. ✨"
  );

}


/* =========================
   SPEECH RECOGNITION
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let finalText = "";


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "id-ID";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;


  recognition.onstart=function(){

    document.getElementById(
      "voiceStatus"
    ).textContent =
      "🎙️ Sedang mendengarkan...";

    document.getElementById(
      "startVoice"
    ).classList.add(
      "listening"
    );

  };


  recognition.onresult=function(event){

    let text="";


    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      text +=
        event.results[i][0].transcript;

    }


    finalText=text;


    document.getElementById(
      "voiceOutput"
    ).textContent =
      text;

  };


  recognition.onerror=function(event){

    document.getElementById(
      "voiceStatus"
    ).textContent =
      "❌ Suara tidak dapat diproses: "
      + event.error;

    document.getElementById(
      "startVoice"
    ).classList.remove(
      "listening"
    );

  };


  recognition.onend=function(){

    document.getElementById(
      "voiceStatus"
    ).textContent =
      "Selesai mendengarkan.";

    document.getElementById(
      "startVoice"
    ).classList.remove(
      "listening"
    );

  };

}


/* =========================
   MULAI SUARA
========================= */

function startVoice(){

  if(!recognition){

    alert(
      "Browser kamu belum mendukung Speech Recognition. Coba gunakan browser yang mendukung fitur suara."
    );

    return;

  }


  finalText="";


  document.getElementById(
    "voiceOutput"
  ).textContent =
    "Mendengarkan...";


  try{

    recognition.start();

  }catch(error){

    console.log(error);

  }

}


/* =========================
   BERHENTI
========================= */

function stopVoice(){

  if(recognition){

    recognition.stop();

  }


  speechSynthesis.cancel();


  document.getElementById(
    "voiceStatus"
  ).textContent =
    "Mode suara dihentikan.";

  document.getElementById(
    "startVoice"
  ).classList.remove(
    "listening"
  );

}


/* =========================
   BACA TEKS
========================= */

function speakText(){

  const text =
    document.getElementById(
      "voiceOutput"
    ).textContent.trim();


  if(
    !text ||
    text ===
    "Hasil suara akan muncul di sini..."
  ){

    alert(
      "Belum ada teks untuk dibacakan."
    );

    return;

  }


  speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "id-ID";

  speech.rate =
    0.95;

  speech.pitch =
    1;


  speechSynthesis.speak(
    speech
  );


  document.getElementById(
    "voiceStatus"
  ).textContent =
    "🔊 Sedang membacakan...";

}


</script>

</body>
</html>
